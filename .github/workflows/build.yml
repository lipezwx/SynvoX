name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract (Portuguese) for the OCR tests
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por fonts-dejavu-core
      - run: pip install pytest openpyxl pypdf pillow pypdfium2 rapidocr-onnxruntime
      - run: pytest -q

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          .\installer\build_installer.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: synvox-installer
          path: installer/Output/*.exe
      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
